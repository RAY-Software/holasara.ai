name: Deploy to Vercel (production)

# Auto-deploy en cada push a main SIN necesitar Vercel Pro: corre el CLI de Vercel
# desde el runner de GitHub (la integración nativa de Git de Vercel requiere Pro para
# repos privados de organización; esto es el workaround gratuito).
#
# Requiere un único secret en el repo (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN  — token de https://vercel.com/account/tokens (scope: el team RAY/diezx)
# Los IDs de org/proyecto NO son secretos y van inline abajo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: team_xQaw4wcxIa3aUS5Lp5d3oXFG
  VERCEL_PROJECT_ID: prj_tGrt98wgK2gBMCV7szrckBJzhBZh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Las vars de tracking están cargadas en Vercel como Sensitive Environment
      # Variables: su valor no se puede volver a leer una vez creado, ni por dashboard
      # ni por API, así que `vercel pull` escribe el literal "[SENSITIVE]" en lugar del
      # valor. Como este proyecto buildea ACÁ y no en Vercel (--prebuilt, el workaround
      # de arriba), ese placeholder termina horneado en el HTML: gtag emite
      # config('[SENSITIVE]') y no dispara ninguna conversión. Estuvo así hasta el
      # 2026-08-07 — cero conversiones registradas del sitio.
      #
      # Reponerlas acá es seguro: son IDs de tag público. Viajan en el HTML servido a
      # cualquier visitante, así que ponerlas en un repo público no expone nada que no
      # esté ya expuesto. NO agregues acá nada que sí sea secreto.
      #
      # Solo pisa el valor si vino como placeholder. Si algún día dejan de estar
      # marcadas como sensibles, el pull trae el valor real y este paso no toca nada.
      - name: Reponer las PUBLIC_* que Vercel devuelve censuradas
        run: |
          ENVFILE=.vercel/.env.production.local
          repair() {
            key=$1; val=$2
            if ! grep -qE "^${key}=" "$ENVFILE"; then
              echo "${key}=\"${val}\"" >> "$ENVFILE"
              echo "  + ${key}: no estaba en Vercel, agregada"
            elif grep -qE "^${key}=\"?\[SENSITIVE\]\"?$" "$ENVFILE"; then
              sed -i "s|^${key}=.*$|${key}=\"${val}\"|" "$ENVFILE"
              echo "  ~ ${key}: placeholder repuesto"
            else
              echo "  = ${key}: valor real, sin tocar"
            fi
          }
          repair PUBLIC_GOOGLE_ADS_ID         "AW-18221376083"
          repair PUBLIC_GOOGLE_ADS_DEMO_LABEL "4p8nCPmuzN0cENPE0PBD"
          repair PUBLIC_GOOGLE_ADS_WA_LABEL   "SOAbCPyuzN0cENPE0PBD"
          repair PUBLIC_META_PIXEL_ID         "4546263272359000"
          # Places ya no va acá: el autocompletado pasa por /api/places-autocomplete y
          # la key vive del lado del servidor (paso "Inyectar la key server-side").
          # Ninguna key de Google viaja al HTML.

      # Key server-side de Places, para la función de api/. NO lleva prefijo PUBLIC_
      # a propósito: las PUBLIC_ se hornean en el HTML y quedan a la vista de cualquier
      # visitante; esta tiene que quedarse del lado del servidor. Va como secret (no
      # como variable) para que Actions la enmascare en los logs.
      - name: Inyectar la key server-side de Places
        # No va como env var: las funciones de Vercel leen su entorno de runtime desde la
        # configuración del proyecto en Vercel, que no controlamos. Comprobado con la sonda
        # /api/ping — el build la tenía y la función no la veía. Lo que sí controlamos es
        # el build, así que la escribimos en el módulo que la función importa y viaja
        # dentro del bundle. El código de una función no se sirve al navegador.
        run: |
          if [ -z "$PLACES_API_KEY" ]; then
            echo "::error::falta el secret PLACES_API_KEY — el autocompletado quedaría muerto"
            exit 1
          fi
          printf "export const PLACES_API_KEY = '%s';\n" "$PLACES_API_KEY" > api/_key.js
          echo "  api/_key.js escrito (${#PLACES_API_KEY} caracteres)"
          # Demo de voz (api/voice-session.ts). Sin key la demo devuelve 503, no rompe el build.
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::falta el secret GEMINI_API_KEY — la demo de voz quedaría apagada"
          fi
          printf "export const GEMINI_API_KEY = '%s';\n" "$GEMINI_API_KEY" > api/_gemini-key.js
          echo "  api/_gemini-key.js escrito (${#GEMINI_API_KEY} caracteres)"
          # Aviso a Slack al terminar una demo de voz (api/voice-end → scrapper). Sin secret, sin aviso.
          if [ -z "$SCRAPPER_INBOUND_SECRET" ]; then
            echo "::warning::falta el secret SCRAPPER_INBOUND_SECRET — no habrá aviso a Slack de las demos de voz"
          fi
          printf "export const SCRAPPER_INBOUND_SECRET = '%s';\n" "$SCRAPPER_INBOUND_SECRET" > api/_scrapper-key.js
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPPER_INBOUND_SECRET: ${{ secrets.SCRAPPER_INBOUND_SECRET }}

      # Vercel detecta las funciones de api/ al ARRANCAR `vercel build`, antes de correr el
      # build command. api/voice-session.js es generado (esbuild desde src/server/), así que
      # tiene que existir antes: se empaqueta acá, con la key ya inyectada arriba.
      - name: Empaquetar funciones TS (api/voice-session.js)
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-api.mjs
          test -s api/voice-session.js

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (prebuilt → production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
