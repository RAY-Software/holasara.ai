name: Deploy to Vercel (production)

# Auto-deploy en cada push a main SIN necesitar Vercel Pro: corre el CLI de Vercel
# desde el runner de GitHub (la integración nativa de Git de Vercel requiere Pro para
# repos privados de organización; esto es el workaround gratuito).
#
# Requiere un único secret en el repo (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN  — token de https://vercel.com/account/tokens (scope: el team RAY/diezx)
# Los IDs de org/proyecto NO son secretos y van inline abajo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: team_xQaw4wcxIa3aUS5Lp5d3oXFG
  VERCEL_PROJECT_ID: prj_tGrt98wgK2gBMCV7szrckBJzhBZh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (prebuilt → production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
