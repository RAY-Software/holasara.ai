<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css"></head>
<body><div id="stage"></div>
<script>
const stage = document.getElementById('stage');
const FPS = 30;
// ---- math / easing ----
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const inv=(t,a,b)=>b<=a?(t>=b?1:0):clamp((t-a)/(b-a),0,1);
const eOut=x=>1-Math.pow(1-x,3);
const eOutQ=x=>1-Math.pow(1-x,4);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const mix=(a,b,p)=>a+(b-a)*p;
const blink=t=>(Math.floor(t/0.55)%2===0)?1:0;
// ---- dom helper ----
function E(tag, cls, css, html){const e=document.createElement(tag); if(cls)e.className=cls;
  if(css)Object.assign(e.style,css); if(html!=null)e.innerHTML=html; return e;}
function rise(el,p,dy=44){el.style.opacity=p; el.style.transform=`translateY(${(1-eOut(clamp(p,0,1)))*dy}px)`;}
function typeText(el,full,p){const n=Math.round(clamp(p,0,1)*full.length); el.textContent=full.slice(0,n);}

const scenes=[];
function scene(start,end,build){
  const el=E('div','scene'); stage.appendChild(el);
  const api=build(el); scenes.push({start,end,el,tick:api.tick||(()=>{}),bg:api.bg});
}

/* ============ SCENE 1 — INTRO (ink) ============ */
scene(0.0,2.0,(el)=>{
  el.style.background='var(--ink)';
  const wrap=E('div','center',{top:'50%',transform:'translate(-50%,-50%)',width:'100%'});
  const wm=E('div','wordmark on-ink',{fontSize:'190px',justifyContent:'center'});
  const txt=E('span'); const caret=E('span','caret',{height:'.72em'});
  wm.appendChild(txt); wm.appendChild(caret); wrap.appendChild(wm);
  const tag=E('div','lead',{marginTop:'40px',color:'var(--cream)',fontSize:'40px',textAlign:'center'},'la recepción que nunca cierra');
  const url=E('div',null,{marginTop:'44px',textAlign:'center',color:'var(--mint)',fontFamily:'Inter',fontWeight:'600',fontSize:'34px'},'holasara.ai');
  wrap.appendChild(tag); wrap.appendChild(url); el.appendChild(wrap);
  txt.textContent='sara';           // formado desde el frame 0 → portada tinta
  return {tick:(lt,t)=>{
    caret.style.opacity=blink(t);
  }};
});

  el.appendChild(clock);
  const feed=E('div',null,{position:'absolute',left:'50%',transform:'translateX(-50%)',top:'340px',width:'760px'});
  el.appendChild(feed);
  function inBubble(txt,time){const b=E('div',null,{background:'#fff',border:'1px solid var(--line)',
    borderRadius:'6px 20px 20px 20px',padding:'22px 26px 30px',maxWidth:'560px',position:'relative',
    boxShadow:'0 10px 30px -18px rgba(10,15,13,.25)',fontSize:'30px',color:'var(--ink)',lineHeight:'1.35',opacity:0},txt);
    b.appendChild(E('span',null,{position:'absolute',right:'20px',bottom:'8px',fontSize:'19px',color:'var(--muted-2)'},time));
    return b;}
  const b1=inBubble('Hola, ¿cuánto cuesta un tratamiento de ácido hialurónico?','11:41 PM');
  b1.style.marginBottom='22px';
  const b2=inBubble('¿Hola?','11:52 PM'); b2.style.width='190px';

  el.appendChild(closed);

    clock.style.opacity=eOut(inv(lt,0.1,0.6));
    b1.style.opacity=eOut(inv(lt,1.1,1.5)); rise(b1,inv(lt,1.1,1.6),24);
    b2.style.opacity=eOut(inv(lt,3.2,3.6)); rise(b2,inv(lt,3.2,3.7),24);
    const cp=inv(lt,4.9,5.5); closed.style.opacity=eOut(cp);
    closed.style.transform=`translateX(-50%) translateY(${(1-eOut(cp))*26}px)`;
  }};
});

    h.style.transform=`translateX(-50%) translateY(${(1-eOut(hp))*30}px)`;

/* ============ engine ============ */
const FIN=0.30, FOUT=0.30;
window.setTime=function(t){
  for(const s of scenes){
    const active = t>=s.start-0.34 && t<s.end+0.02;
    if(!active){ s.el.style.opacity=0; s.el.style.visibility='hidden'; continue; }
    s.el.style.visibility='visible';
    const lt=t-s.start;
    const a=s.start===0?1:inv(t,s.start,s.start+FIN);   // primera escena sin fade-in (portada)
    const b=1-inv(t,s.end-FOUT,s.end);
    s.el.style.opacity=Math.max(0,Math.min(a,b));
    s.tick(lt,t);
  }
};
window.setTime(0);
document.title='sara-video';
